<script>
(function() {
  var sidebarEl = document.querySelector('#sidebar .highlightable');
  if (!sidebarEl) return;

  var savedScroll = sessionStorage.getItem('sidebar_scroll');
  if (savedScroll !== null) {
    sidebarEl.scrollTop = parseInt(savedScroll, 10);
  } else {
    var activeItem = document.querySelector('#sidebar ul.topics li.active > a');
    if (activeItem) {
      activeItem.scrollIntoView({ block: 'center', behavior: 'instant' });
    }
  }

  sidebarEl.addEventListener('scroll', function() {
    sessionStorage.setItem('sidebar_scroll', sidebarEl.scrollTop);
  }, { passive: true });

  document.querySelectorAll('#sidebar a').forEach(function(link) {
    link.addEventListener('click', function() {
      sessionStorage.setItem('sidebar_scroll', sidebarEl.scrollTop);
    });
  });
})();
</script>
